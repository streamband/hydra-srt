name: Release Docker Image

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE: streamband/hydra-srt

jobs:
  sentry_sourcemaps:
    name: Upload React source maps to Sentry
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}

      - name: Validate VERSION matches release tag
        env:
          RAW_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "${RAW_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected release tag format: '${RAW_TAG}' (expected vX.Y.Z)"
            exit 1
          fi
          TAG_VERSION="${RAW_TAG#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "${FILE_VERSION}" != "${TAG_VERSION}" ]; then
            echo "VERSION mismatch: VERSION file='${FILE_VERSION}', release tag='${RAW_TAG}' (expected '${TAG_VERSION}')"
            exit 1
          fi
          echo "VERSION check passed: ${FILE_VERSION}"
          echo "RELEASE_VERSION=${TAG_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Major version must match the Dockerfile builder so asset hashes match the image.
          node-version: '24'
          cache: npm
          cache-dependency-path: web_app/package-lock.json

      - name: Build web app with source maps
        working-directory: web_app
        env:
          VITE_BUILD_SOURCEMAP: 'true'
        run: |
          npm ci
          npm run build

      - name: Verify source maps were produced
        run: |
          map_count="$(find web_app/dist/assets -maxdepth 1 -name '*.map' | wc -l | tr -d ' ')"
          if [ "${map_count}" = "0" ]; then
            echo "No source maps found under web_app/dist/assets"
            exit 1
          fi
          echo "Found ${map_count} source map file(s)"

      - name: Upload source maps to Sentry
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_URL: https://de.sentry.io
        with:
          environment: production
          release: hydra-srt@${{ env.RELEASE_VERSION }}
          sourcemaps: ./web_app/dist/assets
          url_prefix: '~/assets'
          # inject rewrites JS; we need byte-for-byte match with the Docker image bundles.
          inject: false
          finalize: true

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}

      - name: Validate VERSION matches release tag
        env:
          RAW_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "${RAW_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected release tag format: '${RAW_TAG}' (expected vX.Y.Z)"
            exit 1
          fi
          TAG_VERSION="${RAW_TAG#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "${FILE_VERSION}" != "${TAG_VERSION}" ]; then
            echo "VERSION mismatch: VERSION file='${FILE_VERSION}', release tag='${RAW_TAG}' (expected '${TAG_VERSION}')"
            exit 1
          fi
          echo "VERSION check passed: ${FILE_VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pushed without a tag: the merge job names the manifest list instead, so no
      # per-architecture tags end up in the public tag list.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Separate scopes, otherwise the two architectures evict each other's cache.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Manifest
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Verify the published image
        env:
          RAW_TAG: ${{ github.event.release.tag_name }}
        run: |
          platforms="$(docker buildx imagetools inspect "${IMAGE}:${RAW_TAG}" --format '{{json .Manifest}}' \
            | jq -r '.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture' | sort)"
          echo "published platforms:"
          echo "${platforms}"
          for want in linux/amd64 linux/arm64; do
            if ! grep -qx "${want}" <<< "${platforms}"; then
              echo "Missing platform ${want} in ${IMAGE}:${RAW_TAG}"
              exit 1
            fi
          done

          # The runner is amd64, so only that variant can actually be executed here.
          reported="$(docker run --rm "${IMAGE}:${RAW_TAG}" /app/bin/hydra_srt version | tail -n1)"
          echo "image reports: ${reported}"
          if [ "${reported##* }" != "${RAW_TAG#v}" ]; then
            echo "Image version '${reported}' does not match release tag '${RAW_TAG}'"
            exit 1
          fi
